name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release build at a time, and never cancelled: a superseded half-built artifact attached to
# a tag is worse than a slow queue.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Apple Silicon only. It is the one target `docs/validation.md` records as tested, and every Mac
  # that can run this architecture is on macOS 11 or later. Building a universal binary is a
  # one-line change here and in `minimumSystemVersion`, but shipping an Intel slice nobody has run
  # would be claiming support that does not exist.
  TARGET: aarch64-apple-darwin

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: npm ci

      # The same checks CI runs. A release is not the place to find out.
      - name: Verify
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          npm run build

      # Unsigned, deliberately. Signing a distributable Mac app needs a Developer ID certificate,
      # which Apple issues only to paid Developer Program members — and Orbiter exists for people
      # who do not have one. The cost is moved to whoever downloads it: macOS blocks the app the
      # first time and they approve it once in System Settings. `docs/release.md` says so, and so
      # do the release notes below, because a download that fails to open with no explanation is
      # worse than one that warns you first.
      - name: Build
        run: npm run tauri build -- --target "$TARGET" --bundles app,dmg

      - name: Name the artifact
        id: artifact
        run: |
          image=$(ls target/$TARGET/release/bundle/dmg/*.dmg | head -1)
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          named="Orbiter-$version-apple-silicon.dmg"
          mv "$image" "$RUNNER_TEMP/$named"
          # From inside the directory, so the checksum names the file and not the runner's path —
          # `shasum -c` beside the download then works as written. It is the only thing a person
          # can check about an unsigned build, so it ships with every release.
          (cd "$RUNNER_TEMP" && shasum -a 256 "$named" > "$named.sha256")
          echo "path=$RUNNER_TEMP/$named" >> "$GITHUB_OUTPUT"
          echo "checksum=$RUNNER_TEMP/$named.sha256" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: orbiter-macos-apple-silicon
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.checksum }}
          retention-days: 14

      # Only a tag publishes, and it publishes as a draft: the physical-device checks in
      # docs/validation.md cannot run here, and nothing signs off on a build but a person.
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.artifact.outputs.path }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Apple Silicon, macOS 11 or later.

          ## Opening it the first time

          This build is not signed with an Apple Developer ID, so macOS blocks it until you allow
          it once:

          1. Open the DMG and drag **Orbiter** to Applications.
          2. Open Orbiter. macOS refuses, saying it cannot check the app for malicious software.
          3. Go to **System Settings → Privacy & Security**, scroll down to **Security**, and
             click **Open Anyway** beside the message about Orbiter.
          4. Open Orbiter again and confirm.

          Only the first launch needs this.

          ## Verifying the download

          Download the `.sha256` file alongside the DMG, then, in the same folder:

          ```sh
          shasum -a 256 -c *.sha256
          ```
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "Orbiter ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$DMG" "$CHECKSUM"
