[package]
name = "orbiter-core"
version = "0.1.0"
edition = "2024"
default-run = "orbiter-core"
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
plist = { version = "=1.10.1", features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
cms = "=0.2.3"
der = { version = "=0.7.10", features = ["alloc"] }
base64 = "=0.23.1"
thiserror = "=2.0.20"
idevice = { version = "=0.1.65", default-features = false, features = ["usbmuxd", "ring", "afc", "installation_proxy", "syslog_relay"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time", "macros", "process", "io-util"] }
sha2 = "=0.10.9"
uuid = { version = "=1.26.1", features = ["v4"] }
tempfile = "=3.27.0"
# Structured diagnostics for workflows; the desktop shell installs the subscriber.
tracing = "=0.1.44"

isideload = { version = "=0.3.17", default-features = false, features = ["install"] }
zeroize = "=1.9.0"
# Development-certificate request: an RSA key generated on this Mac and a PKCS#10 CSR. Versions
# match the ones the vendored authentication adapter already resolves, so no second copy enters
# the graph.
rsa = "=0.10.0-rc.18"
rand = "=0.10.2"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }

# The signer. Same fork and version the vendored sideloading crate resolves, so one copy of the
# code-signing implementation is in the graph, not two.
apple-codesign = { version = "=0.29.11", package = "isideload-apple-codesign", default-features = false }
x509-certificate = { version = "=0.26.1", package = "isideload-x509-certificate" }

async-trait = "=0.1.92"
rootcause = "=0.12.1"
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }

[build-dependencies]
cc = "=1.4.5"
