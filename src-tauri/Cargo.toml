[package]
name = "orbiter"
version = "0.1.0"
edition = "2024"
[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
orbiter-core = { path = "../crates/orbiter-core" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }

[dev-dependencies]
# Asserting the exact JSON a failure crosses as; the frontend matches on that shape.
serde_json = "=1.0.151"
